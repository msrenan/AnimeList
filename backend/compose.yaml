services:
  postgres:
    image: 'postgres:latest'
    environment:
      - POSTGRES_DB=animelist-db
      - POSTGRES_PASSWORD=senha
      - POSTGRES_ROOT_PASSWORD=#VYRQ9LP8
      - POSTGRES_USER=api
    ports:
      - 5432:5432
    expose:
      - 5432
    volumes:
      - animelist_data:/var/lib/postgresql/

volumes:
  animelist_data:
