spring.application.name=backend

# Banco de dados (sobrescreva com variáveis de ambiente em produção)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/animelist-db}
spring.datasource.username=${DB_USER:api}
spring.datasource.password=${DB_PASSWORD:senha}

# Evita consultas lazy inesperadas na camada de apresentação
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Segredo do JWT (sobrescreva com JWT_SECRET em produção)
api.security.token.secret=${JWT_SECRET:Zulu2387/*-/Alpha1445/*-/}

# Expiração do token em horas
api.security.token.expiration-hours=${JWT_EXPIRATION_HOURS:6}
